services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LectureLoom
      - ENVIRONMENT=local
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/lectureloom
      - USAGE_DB_PATH=/app/data/usage.db
      - PRIMARY_MODEL=gpt-4o-mini
      - FALLBACK_MODEL=gpt-3.5-turbo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=lectureloom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lectureloom"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
